[project]
name = "batching"
version = "0.1.0"
description = "When does batch prompting help LLMs? Experiments, metrics, and tooling."
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "requests",
    "pandas",
    "errant",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
